scraping:
  host: :9003
  scrapCron: 3

database:
  dialect: pgx
  dsn: "host=localhost port=5432 user=articles password=articles dbname=scrapping sslmode=disable"
  maxOpenConns: 10
  maxIdleConns: 5
  connMaxLifeTime: 3600

kafka:
  topic: "scrapping"
  brokers:
    - "localhost:9092"
  dialTimeout: 20